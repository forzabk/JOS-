<!doctype html>

<style>:root{color-scheme:dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: tela cheia, preto profundo. Moedas de ouro, platina e ouro rosé giram devagar em orbitas de fio fino ao redor de um painel de vidro com nome, uma frase e o botao. Visual escuro unico, de proposito. */
:root {
  color-scheme: dark;
  --bg: #07080b;
  --ink: #f3efe6;
  --muted: #a39e92;
  --gold: #d8b46a;
  --gold-deep: #b8914a;
  --platinum: #c9d1e0;
  --line: rgba(216, 180, 106, 0.28);
  --glass: rgba(9, 10, 14, 0.62);
  --font-display: "Cormorant Garamond", "Georgia", "Times New Roman", serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.6;
  min-height: 100svh;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  position: relative;
}
#bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.ui { position: relative; z-index: 1; min-height: 100svh; display: flex; flex-direction: column; justify-content: space-between; padding-block: 24px 20px; }
.brand { font-family: var(--font-body); font-weight: 600; font-size: 12px; letter-spacing: 0.32em; text-transform: uppercase; color: var(--gold); }
.panel {
  align-self: center; width: 100%; max-width: 500px; text-align: center;
  background: var(--glass); border: 1px solid var(--line); border-radius: 28px;
  padding: 46px 32px 40px;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 60px rgba(216, 180, 106, 0.08);
}
.kicker { display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 11px; font-weight: 600; letter-spacing: 0.44em; text-transform: uppercase; color: var(--gold); margin: 0 0 22px; text-shadow: 0 0 16px rgba(216, 180, 106, 0.4); }
.kicker::before, .kicker::after { content: ""; flex: 0 1 44px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold)); }
.kicker::after { background: linear-gradient(270deg, transparent, var(--gold)); }
.mono { width: 64px; height: 64px; margin: 0 auto 22px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-size: 26px; font-weight: 600; letter-spacing: 0.04em; color: var(--gold); border: 1px solid var(--gold); background: radial-gradient(circle at 30% 30%, rgba(216, 180, 106, 0.22), rgba(216, 180, 106, 0.04)); box-shadow: 0 0 0 5px rgba(216, 180, 106, 0.08), 0 0 28px rgba(216, 180, 106, 0.25); }
.role { margin: 14px 0 0; font-size: 12px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: var(--platinum); }
h1 { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: clamp(40px, 10vw, 64px); line-height: 1.02; letter-spacing: -0.01em; text-wrap: balance; color: #f6dc9c; text-shadow: 0 0 4px rgba(255, 220, 130, 0.7), 0 0 16px rgba(240, 190, 90, 0.7), 0 0 38px rgba(216, 180, 106, 0.5), 0 0 80px rgba(216, 180, 106, 0.3); }
.sub { margin: 20px auto 0; max-width: 24ch; color: var(--muted); font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: clamp(24px, 6vw, 30px); line-height: 1.2; text-wrap: balance; }
.sub .gold { color: var(--gold); font-style: normal; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.78em; text-shadow: 0 0 18px rgba(216, 180, 106, 0.45); }
.btn {
  margin-top: 30px; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  background: linear-gradient(180deg, #e6c98a, var(--gold-deep)); color: #17120a; font-weight: 700; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 17px 30px; border-radius: 999px; text-decoration: none;
  box-shadow: 0 0 0 1px rgba(230, 201, 138, 0.9), 0 10px 30px rgba(216, 180, 106, 0.25);
  transition: box-shadow .25s ease, transform .25s ease;
}
.btn:hover { box-shadow: 0 0 0 1px #f0d9a2, 0 14px 40px rgba(216, 180, 106, 0.45); transform: translateY(-1px); }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn:focus-visible { outline: 3px solid var(--platinum); outline-offset: 4px; }
.note { margin: 20px auto 0; max-width: 40ch; color: var(--muted); font-size: 13px; letter-spacing: 0.02em; }
.foot { text-align: center; font-size: 12px; color: var(--muted); max-width: 70ch; margin-inline: auto; padding-top: 14px; }
@media (max-width: 480px) { .panel { padding: 36px 22px 32px; border-radius: 24px; } }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:hover { transform: none; } }
</style>

<canvas id="bg" aria-hidden="true"></canvas>

<div class="ui">
  <div class="brand" data-name>Jose Vascencelos</div>

  <main class="panel">
    <div class="mono" data-initials aria-hidden="true">JV</div>
    <p class="kicker">Canal no Telegram</p>
    <h1 data-name>Jose Vascencelos</h1>    <p class="sub"><span class="gold">Cripto</span> para iniciantes, em português simples.</p>
    <label style="display:block;font-size:13px;line-height:1.5;margin:16px 0;color:#ccc"><input type="checkbox" id="tracking-consent"> Autorizo o uso dos dados desta visita e da minha entrada no canal para medir resultados com a Meta. Opcional.</label>
    <p id="join-status" role="status" style="font-size:13px" hidden></p>
    <a class="btn" data-cta href="https://t.me/+odBJEl8uvCs0MDA8" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.9 3.6 2.6 11c-1.3.5-1.3 1.3-.2 1.6l4.9 1.5 1.9 5.8c.2.6.1.8.7.8.5 0 .7-.2 1-.5l2.4-2.3 4.9 3.6c.9.5 1.5.2 1.7-.8l3.1-14.6c.3-1.2-.4-1.8-1.1-1.5ZM8.4 13.3l9.7-6.1c.5-.3.9-.1.5.2l-8.3 7.5-.3 3.4-1.6-5Z"/></svg>
      Entrar no canal
    </a>  </main>

  <footer class="foot">Telegram é marca de seus respectivos titulares e esta página não tem vínculo com a empresa. Símbolos de criptomoedas meramente ilustrativos.</footer>
</div>

<script>
/* ===== EDITE AQUI =====
   CHANNEL_URL: link do canal. PIXEL_ID: número do Pixel da Meta (deixe "" enquanto não tiver). */
var CHANNEL_URL = "https://t.me/+odBJEl8uvCs0MDA8";
var CHANNEL_NAME = "Jose Vascencelos";
var PIXEL_ID = "2312048342907436";
/* ====================== */
document.querySelectorAll("[data-cta]").forEach(function (a) { a.href = CHANNEL_URL; });
document.querySelectorAll("[data-name]").forEach(function (el) { el.textContent = CHANNEL_NAME; });
document.querySelectorAll("[data-initials]").forEach(function (el) {
  el.textContent = CHANNEL_NAME.split(/\s+/).map(function (w) { return w.charAt(0); }).join("").slice(0, 2).toUpperCase();
});

var consent = document.getElementById('tracking-consent');
var joinStatus = document.getElementById('join-status');
var pixelStarted = false;
consent.addEventListener('change', function () {
  if (!consent.checked || !PIXEL_ID || pixelStarted) return;
  pixelStarted = true;
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', PIXEL_ID);
  fbq('track', 'PageView');
});
var visitId = null;
var joining = false;
document.querySelectorAll('[data-cta]').forEach(function (a) {
  a.addEventListener('click', async function (event) {
    if (!consent.checked) return;
    event.preventDefault();
    if (joining) return;
    joining = true;
    a.setAttribute('aria-busy', 'true');
    joinStatus.hidden = false;
    joinStatus.textContent = 'Preparando seu convite…';
    try {
      if (!visitId) visitId = Array.from(crypto.getRandomValues(new Uint8Array(16)), function (n) { return n.toString(16).padStart(2, '0'); }).join('');
      var r = await fetch('/api/join', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        signal: AbortSignal.timeout(15000),
        body: JSON.stringify({consent: true, visit: visitId, fbclid: new URLSearchParams(location.search).get('fbclid') || ''})
      });
      var result = await r.json();
      if (!r.ok || !/^https:\/\/t\.me\/[+A-Za-z0-9_-]+$/.test(result.url || '')) throw new Error('invite');
      if (window.fbq) fbq('track', 'Lead');
      location.assign(result.url);
    } catch (error) {
      joinStatus.textContent = 'Não foi possível preparar o convite. Tente novamente ou entre sem medição.';
      var fallback = document.createElement('a');
      fallback.href = CHANNEL_URL;
      fallback.textContent = ' Entrar sem medição';
      joinStatus.appendChild(fallback);
    } finally {
      joining = false;
      a.removeAttribute('aria-busy');
    }
  });
});

/* Fundo: moedas de ouro, platina e ouro rose girando devagar em orbitas de fio fino. */
(function () {
  var c = document.getElementById("bg");
  var ctx = c.getContext("2d");
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var W = 0, H = 0, px = 0.5, py = 0.5, dust = [], coins = [];
  var GOLD = { h: 41, s: 62, l: 62 }, PLAT = { h: 218, s: 28, l: 80 }, ROSE = { h: 14, s: 48, l: 70 };
  var ORBITS = [
    { rx: 0.38, ry: 0.32, tilt: -0.35, speed: 0.00034, n: 4, col: GOLD },
    { rx: 0.48, ry: 0.40, tilt: 0.30, speed: -0.00027, n: 4, col: PLAT },
    { rx: 0.58, ry: 0.48, tilt: -0.12, speed: 0.00021, n: 4, col: ROSE }
  ];
  var TYPES = ["btc", "eth", "ltc", "usdt", "eth", "btc", "usdt", "ltc", "btc", "ltc", "eth", "usdt"];
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function hsl(col, l, a) { return "hsla(" + col.h + "," + col.s + "%," + l + "%," + a + ")"; }

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function init() {
    dust = [];
    var nd = W < 600 ? 40 : 70;
    for (var i = 0; i < nd; i++) dust.push({ x: Math.random(), y: Math.random(), s: rnd(0.5, 1.3), ph: rnd(0, 6.28), sp: rnd(0.0004, 0.0012), dy: rnd(0.000002, 0.000008) });
    coins = [];
    var base = Math.min(W, H), idx = 0;
    for (var o = 0; o < ORBITS.length; o++) {
      var O = ORBITS[o];
      for (var k = 0; k < O.n; k++) {
        coins.push({
          o: o, type: TYPES[idx++ % TYPES.length],
          a: (k / O.n) * 6.2832 + rnd(-0.25, 0.25),
          r: Math.max(9, Math.min(21, base * rnd(0.024, 0.04))),
          spin: rnd(0, 6.28),
          spinSp: rnd(0.0018, 0.0036) * (Math.random() < 0.5 ? -1 : 1),
          rp: rnd(0, 6.28), rs: rnd(0.0003, 0.0006)
        });
      }
    }
  }

  /* simbolos gravados, desenhados em tracos finos */
  function glyph(type, r, col) {
    var s = r * 1.55;
    ctx.save();
    ctx.lineWidth = Math.max(1.2, r * 0.09);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = hsl(col, 93, 0.95);
    ctx.beginPath();
    if (type === "btc") {
      ctx.rotate(0.245);
      ctx.moveTo(-0.18 * s, -0.3 * s); ctx.lineTo(-0.18 * s, 0.3 * s);
      ctx.moveTo(-0.18 * s, -0.3 * s); ctx.lineTo(0.06 * s, -0.3 * s);
      ctx.bezierCurveTo(0.26 * s, -0.3 * s, 0.26 * s, -0.01 * s, 0.06 * s, -0.01 * s);
      ctx.lineTo(-0.18 * s, -0.01 * s);
      ctx.moveTo(0.1 * s, -0.01 * s);
      ctx.bezierCurveTo(0.34 * s, -0.01 * s, 0.34 * s, 0.3 * s, 0.1 * s, 0.3 * s);
      ctx.lineTo(-0.18 * s, 0.3 * s);
      ctx.moveTo(-0.06 * s, -0.42 * s); ctx.lineTo(-0.06 * s, -0.3 * s);
      ctx.moveTo(0.06 * s, -0.42 * s); ctx.lineTo(0.06 * s, -0.3 * s);
      ctx.moveTo(-0.06 * s, 0.3 * s); ctx.lineTo(-0.06 * s, 0.42 * s);
      ctx.moveTo(0.06 * s, 0.3 * s); ctx.lineTo(0.06 * s, 0.42 * s);
    } else if (type === "eth") {
      ctx.moveTo(0, -0.46 * s); ctx.lineTo(0.25 * s, 0.02 * s); ctx.lineTo(0, 0.14 * s); ctx.lineTo(-0.25 * s, 0.02 * s); ctx.closePath();
      ctx.moveTo(-0.25 * s, 0.02 * s); ctx.lineTo(0.25 * s, 0.02 * s);
      ctx.moveTo(0, 0.22 * s); ctx.lineTo(0.25 * s, 0.1 * s); ctx.lineTo(0, 0.46 * s); ctx.lineTo(-0.25 * s, 0.1 * s); ctx.closePath();
    } else if (type === "ltc") {
      ctx.moveTo(-0.04 * s, -0.36 * s); ctx.lineTo(-0.14 * s, 0.2 * s); ctx.lineTo(0.22 * s, 0.2 * s);
      ctx.moveTo(-0.26 * s, 0.02 * s); ctx.lineTo(0.14 * s, -0.12 * s);
    } else {
      ctx.moveTo(-0.3 * s, -0.3 * s); ctx.lineTo(0.3 * s, -0.3 * s);
      ctx.moveTo(0, -0.3 * s); ctx.lineTo(0, 0.38 * s);
      ctx.moveTo(0.2 * s, -0.02 * s);
      ctx.ellipse(0, -0.02 * s, 0.2 * s, 0.065 * s, 0, 0, 6.2832);
    }
    ctx.stroke();
    ctx.restore();
  }

  function coin(x, y, r, spin, type, col, a) {
    var sx = Math.max(Math.abs(Math.cos(spin)), 0.16);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(x, y);
    ctx.scale(sx, 1);
    var g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.05, 0, 0, r);
    g.addColorStop(0, hsl(col, 78, 0.75));
    g.addColorStop(0.6, hsl(col, 52, 0.55));
    g.addColorStop(1, hsl(col, 32, 0.5));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.fill();
    ctx.shadowColor = hsl(col, 60, 0.7);
    ctx.shadowBlur = 9;
    ctx.lineWidth = Math.max(1.2, r * 0.08);
    ctx.strokeStyle = hsl(col, 82, 0.95);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.lineWidth = 0.8;
    ctx.strokeStyle = hsl(col, 90, 0.5);
    ctx.beginPath(); ctx.arc(0, 0, r * 0.8, 0, 6.2832); ctx.stroke();
    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(255,255,255,0.45)";
    ctx.beginPath(); ctx.arc(0, 0, r * 0.9, 3.5, 4.3); ctx.stroke();
    glyph(type, r, col);
    ctx.restore();
  }

  var last = 0, T = 0;
  function frame(t) {
    var dt = Math.min(40, t - last || 16); last = t;
    var m = reduce ? 0 : 1;
    T += dt * m;
    ctx.clearRect(0, 0, W, H);

    /* luzes suaves: uma dourada e uma fria */
    var blobs = [[0.22, 0.28, GOLD, 0.00004], [0.8, 0.72, PLAT, 0.00003]];
    for (var b = 0; b < blobs.length; b++) {
      var bx = (blobs[b][0] + Math.sin(T * blobs[b][3] * 6 + b) * 0.1) * W;
      var by = (blobs[b][1] + Math.cos(T * blobs[b][3] * 5 + b * 2) * 0.08) * H;
      var br = Math.max(W, H) * 0.45;
      var bg = ctx.createRadialGradient(bx, by, 0, bx, by, br);
      bg.addColorStop(0, hsl(blobs[b][2], 60, 0.09));
      bg.addColorStop(1, hsl(blobs[b][2], 60, 0));
      ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    }

    /* poeira de ouro */
    for (var i = 0; i < dust.length; i++) {
      var d = dust[i];
      d.y -= d.dy * dt * m; if (d.y < 0) d.y = 1;
      var tw = 0.3 + 0.7 * Math.abs(Math.sin(T * d.sp + d.ph));
      ctx.fillStyle = hsl(GOLD, 78, 0.5 * tw);
      ctx.beginPath(); ctx.arc(d.x * W, d.y * H, d.s, 0, 6.2832); ctx.fill();
    }

    /* orbitas de fio fino */
    var cx = W / 2 + (px - 0.5) * 20, cy = H / 2 + (py - 0.5) * 20;
    for (var o = 0; o < ORBITS.length; o++) {
      var O = ORBITS[o];
      ctx.save();
      ctx.translate(cx, cy); ctx.rotate(O.tilt);
      ctx.lineWidth = 0.8;
      ctx.strokeStyle = hsl(O.col, 70, 0.2);
      ctx.beginPath(); ctx.ellipse(0, 0, W * O.rx, H * O.ry, 0, 0, 6.2832); ctx.stroke();
      ctx.restore();
    }

    /* moedas, as de tras primeiro */
    var draws = [];
    for (var k = 0; k < coins.length; k++) {
      var cn = coins[k], OO = ORBITS[cn.o];
      cn.a += OO.speed * dt * m;
      cn.spin += cn.spinSp * dt * m;
      /* f: 1 = orbita externa, 0.5 = perto do centro. A moeda desliza para dentro e para fora. */
      var f = 0.5 + 0.5 * (0.5 + 0.5 * Math.sin(T * cn.rs + cn.rp));
      var ex = Math.cos(cn.a) * W * OO.rx * f, ey = Math.sin(cn.a) * H * OO.ry * f;
      var cs = Math.cos(OO.tilt), sn = Math.sin(OO.tilt);
      draws.push({ x: cx + ex * cs - ey * sn, y: cy + ex * sn + ey * cs, z: 1 - f, c: cn, col: OO.col });
    }
    draws.sort(function (a, b) { return a.z - b.z; });
    for (var q = 0; q < draws.length; q++) {
      var e = draws[q], sc = 0.75 + 2.6 * e.z;
      coin(e.x, e.y, e.c.r * sc, e.c.spin, e.c.type, e.col, 0.55 + 0.8 * e.z);
    }
    requestAnimationFrame(frame);
  }

  window.addEventListener("pointermove", function (e) { px = e.clientX / W; py = e.clientY / H; });
  window.addEventListener("resize", function () { resize(); init(); });
  resize(); init();
  requestAnimationFrame(frame);
})();
</script>
